name: Google Play release

# tag-builds.yml dispatches this after it publishes a release tag (not prereleases), and it can be
# run by hand to publish an existing release's Play bundle.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose Play bundle to publish'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: MrJackSpade/Kairo/.github/workflows/app-play-release.yml@6458fe8a8a93b3409097d50c93a48fe48cfb6a26
    with:
      name: KairoX86
      package: com.loxifi.kairox86
      tag: ${{ inputs.tag }}
